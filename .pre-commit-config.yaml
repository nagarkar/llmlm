# metalm standard hooks (guidelines/design.md#generated-docs, guidelines/coding.md).
# The owner approves this file once; after it is committed, agents run `pre-commit install`
# (and `pre-commit install --hook-type pre-push`) in any checkout of the repo without asking.
# A new or changed hook is approved again.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch   # branch for every change (guidelines/index.md)
        args: [--branch, main]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/nagarkar/metalm
    rev: cd6d0744aaef1034fa1048e67ae37443aad77e24   # update with: pre-commit autoupdate --bleeding-edge --repo https://github.com/nagarkar/metalm
    hooks:
      - id: metalm-gendocs   # regenerates docs/generated/; stops the commit when it changed files
  - repo: local
    hooks:
      - id: import-contracts   # module map (guidelines/design.md#the-package-docstring)
        name: import contracts
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: consumer-gate   # every migrated consumer's tests against this working tree
        name: consumer gate
        entry: tools/check-consumers.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
