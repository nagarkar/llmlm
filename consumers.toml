# The consumer-test gate (llmlm package docstring): every tool that imports llmlm, with the
# checkout beside this one and the test command that runs on the scripted tier (no model, no
# cost). `tools/check-consumers.sh` runs each `migrated = true` row before a push and in CI;
# a row flips to true in the PR that moves that tool onto llmlm (nagarkar/llmlm#1).
#
# path:   the sibling checkout, relative to the folder that holds llmlm
# repo:   the GitHub name CI clones (with CONSUMERS_TOKEN, read-only)
# test:   the test command, run from the consumer's root with llmlm installed editable
# subdir: where the Python project sits inside the checkout, when not at its root

[consumers.corpuslm]
path = "corpuslm"
repo = "nagarkar/corpuslm"
test = ".venv/bin/pytest -q"
migrated = true

[consumers.ytlm]
path = "ytlm"
repo = "nagarkar/ytlm"
test = ".venv/bin/pytest -q"
migrated = true

[consumers.beelm]
path = "beelm"
repo = "nagarkar/beelm"
test = ".venv/bin/pytest -q"
migrated = true

[consumers.mailerlm]
path = "mailerlm"
repo = "nagarkar/mailerlm"
test = ".venv/bin/pytest -q"
migrated = true

[consumers.supplylm]
path = "supplylm"
repo = "nagarkar/supplylm"
test = ".venv/bin/pytest -q"
migrated = true

[consumers.gamelm]
path = "gamelm"
repo = "nagarkar/gamelm"
test = ".venv/bin/pytest -q"
migrated = true

[consumers.podlm]
path = "podlm"
repo = "nagarkar/podlm"
# the three deselected tests fail on podlm's own main in a plain venv (card and PNG rendering that
# needs the podlm-assets conda env's Pillow build), whatever llmlm does
test = ".venv/bin/pytest -q --deselect tests/test_edit_draft.py::CardCutawayTest::test_full_card_and_banner_render_into_the_draft --deselect tests/test_interrupted_writes.py::InterruptedCardSaveTests::test_failed_save_leaves_no_png_at_the_final_path --deselect tests/test_verse_card_wrap.py::VerseCardWrapTests::test_a_full_couplet_stays_inside_the_frame"
migrated = true

[consumers.authorlm]
path = "authorllm"
subdir = "authorlm"
repo = "nagarkar/authorllm"
# authorlm's suites are scripts, not pytest modules; the live suite (test_live_llm.py) records
# billed calls on a miss and is left out
test = "for f in tests/test_*.py; do [ \"$f\" = tests/test_live_llm.py ] || .venv/bin/python \"$f\" || exit 1; done"
migrated = true
